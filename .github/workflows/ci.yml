name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # node-pty drives ConPTY on Windows and a Unix pty on Linux; each platform
    # skips the tests that only apply to the other.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Third-party notices are current
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run licenses:generate
          if ($LASTEXITCODE -ne 0) {
            throw 'License generation failed. Every production dependency must include a license text.'
          }
          # --quiet reports through the exit code and prints nothing, so the
          # result has to be read from $LASTEXITCODE rather than from output.
          git diff --quiet -- THIRD-PARTY-LICENSES.md
          if ($LASTEXITCODE -ne 0) {
            git --no-pager diff -- THIRD-PARTY-LICENSES.md
            throw 'THIRD-PARTY-LICENSES.md is stale. Run "npm run licenses:generate" and commit the result.'
          }
