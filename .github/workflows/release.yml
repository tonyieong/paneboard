name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Ensure the tag is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to a commit reachable from main.'
          }

      - name: Ensure the tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (node -p "require('./package.json').version").Trim()
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match package.json version v$packageVersion."
          }

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Third-party notices are current
        shell: pwsh
        run: |
          npm run licenses:generate
          if ($LASTEXITCODE -ne 0) {
            throw 'License generation failed. Every production dependency must include a license text.'
          }
          git diff --quiet -- THIRD-PARTY-LICENSES.md
          if ($LASTEXITCODE -ne 0) {
            git --no-pager diff -- THIRD-PARTY-LICENSES.md
            throw 'THIRD-PARTY-LICENSES.md is stale. Run "npm run licenses:generate" and commit the result.'
          }

      - run: npm run package:win

      - name: Assemble the release archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG
          $stage = "staging/paneboard-$version-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item dist/paneboard.exe $stage
          Copy-Item dist/scripts, dist/assets, dist/plugin-panes -Destination $stage -Recurse
          # These travel with the binary because the packaged exe embeds every
          # production dependency and their licenses require the notices.
          Copy-Item LICENSE, THIRD-PARTY-LICENSES.md, README.md, SECURITY.md, config.example.toml $stage
          Compress-Archive -Path $stage -DestinationPath "paneboard-$version-windows-x64.zip"

      - name: Publish checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter 'paneboard-*-windows-x64.zip'
          $files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # paneboard ships unsigned, so SmartScreen will warn. The checksum file is
          # the only way a downloader can verify what they got.
          $notes = @"
          Download **paneboard-$($env:RELEASE_TAG)-windows-x64.zip** from the assets
          below. The "Source code" archives GitHub adds to every release hold the
          source tree only, without paneboard.exe.

          Extract the zip to a folder, then double click paneboard.exe. Opening it
          inside the Windows zip viewer unpacks that one file to a temp
          directory and leaves the rest in the archive.

          Verify your download before running it:

          ``````powershell
          Get-FileHash .\paneboard-$($env:RELEASE_TAG)-windows-x64.zip -Algorithm SHA256
          ``````

          Compare the result against ``SHA256SUMS.txt``. This build is not code
          signed, so Windows SmartScreen will show an unknown publisher warning.

          Once the checksum matches, clear the download mark before extracting:
          right click the zip, open Properties, tick Unblock, press OK. Otherwise
          the first run raises SmartScreen, where "More info" then "Run anyway"
          lets it through.
          "@
          gh release create $env:RELEASE_TAG `
            "paneboard-$($env:RELEASE_TAG)-windows-x64.zip" SHA256SUMS.txt `
            --title "paneboard $($env:RELEASE_TAG)" `
            --notes $notes `
            --verify-tag
