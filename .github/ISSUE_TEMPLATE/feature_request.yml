name: Feature request
description: Suggest a capability Paneboard does not have yet.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Paneboard is a Windows-only workspace that hands a browser a PowerShell
        session. Proposals that widen that exposure — remote access, running as
        another account, disabling the host checks — need to explain the
        security tradeoff, not just the convenience.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Paneboard to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
      description: >-
        Existing settings, another tool, or a workaround — and why it was not
        enough.
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: >-
            This keeps Paneboard usable as a single-user desktop tool, or I have
            described the security tradeoff above.
          required: true
